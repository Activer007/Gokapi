name: Compile and run unit tests
on: [workflow_dispatch, push, pull_request]

permissions:
  contents: read

# A push followed by its PR event should validate the head only once.
concurrency:
  group: tests-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify reviewed Go compiler and builder policy
        run: python3 docs/security/tools/check-sec062-toolchain.py --actual "$(go env GOVERSION)"
      - run: |
          go generate ./...
          git diff --exit-code
      # GREEN contract: the configured product port is occupied, while setup tests
      # use held OS-assigned listeners. Never run the historical --red mode here.
      - name: Setup tests with configured port occupied
        run: bash docs/security/tools/run-sec062-setup-listener.sh --occupied
      - run: go test ./... -parallel 8 -count=1 --tags=test,awsmock
      - run: go test ./... -parallel 8 -count=1 --tags=test,noaws
      - run: go test ./... --tags=test,noaws,integration -count=1
      - run: GOKAPI_AWS_BUCKET="gokapi" GOKAPI_AWS_REGION="eu-central-1" GOKAPI_AWS_KEY="keyid" GOKAPI_AWS_KEY_SECRET="secret" go test ./...  --tags=test,awstest -count=1
      - name: Receiver contracts with race
        run: go test -race ./internal/environment ./internal/storage ./internal/storage/uploadreceive ./internal/webserver/fileupload ./internal/webserver/api ./internal/webserver -count=1 -tags=test,noaws -run 'TestSEC030Receive|TestSEC031UploadSizeSemantics|TestReceive|TestSpool|TestSEC062Range'
      - name: Encrypted download failure contract with race
        run: go test -race ./internal/storage -count=1 -tags=test,noaws -run '^TestSEC052ServeFile(Failure|Cancel)$'
      - name: Response policy, artifacts and real SSE upload with race
        run: go test -race ./internal/webserver ./internal/webserver/headers -count=1 -tags=test,noaws -run '^TestSEC050|^TestPostUpload$|^TestWriteDownloadHeaders$' -timeout=90s
      - name: Retryable cleanup and provider contracts with race
        run: go test -race ./internal/test/securityfixture ./internal/configuration/database/provider/sqlite ./internal/configuration/database/provider/redis -count=1 -tags=test,security_cleanup -run '^TestSEC040Cleanup' -timeout 3m -v
      - name: Deletion state, timer and API contracts with race
        run: go test -race ./internal/storage ./internal/storage/filerequest ./internal/webserver/api ./internal/configuration/database/provider/sqlite ./internal/configuration/database/provider/redis ./internal/webserver/api/mutex/apimutex ./cmd/cli-uploader/cliapi -count=1 -tags=test,noaws,security_deletion,security_replace -run 'TestSEC040|TestSEC030ReplaceLocks' -timeout 3m -v
      - name: Old content, process restart and candidate migration contracts with race
        run: go test -race ./internal/blobreclaim ./internal/storage ./internal/configuration/database ./internal/configuration/database/provider/sqlite ./internal/configuration/database/provider/redis -count=1 -tags=test,noaws,security_reclaim -run 'TestSEC041|TestCandidateRecordBoundary' -timeout 3m -v
      - name: Old content retry against loopback S3 with race
        run: go test -race ./internal/test/securityfixture -count=1 -tags=test,security_cleanup,security_reclaim -run '^TestSEC041OldContentS3RetryKeepsReplacement$' -timeout 2m -v
      - name: Whole and chunk upload durable admission and provider contracts
        run: bash docs/security/tools/run-sec030-whole.sh target
      - name: Whole and chunk upload durable admission with race
        run: bash docs/security/tools/run-sec030-whole.sh race
      - name: Record security source hashes
        run: |
          git ls-files -- cmd/supashare/Main.go cmd/cli-uploader/cliapi internal/blobreclaim internal/configuration/database internal/environment internal/storage internal/uploadquota internal/webserver | grep -E '\.go$' | LC_ALL=C sort | xargs sha256sum
          sha256sum cmd/wasmdownloader/Main.go internal/webserver/web/templates/html_download.tmpl internal/webserver/web/main.wasm
      - name: Toolchain build and vulnerability gates
        run: bash docs/security/tools/run-sec062-toolchain.sh scan
      - name: Historical vulnerable compiler scan contract
        if: github.event_name == 'workflow_dispatch'
        run: bash docs/security/tools/run-sec062-toolchain.sh historical
      - name: Reviewed Docker builders (local only)
        if: github.event_name == 'workflow_dispatch'
        run: bash docs/security/tools/run-sec062-toolchain.sh containers
      - name: Opt-in large upload validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          df -h "$RUNNER_TEMP"
          if ! bash docs/security/tools/run-sec030-receiver.sh large; then
            tail -n 80 docs/security/evidence/sec030-receiver-*.secret/large.log
            exit 1
          fi
          grep RECEIVE_METRIC docs/security/evidence/sec030-receiver-*.secret/large.log
      - name: Opt-in large chunk HTTP and encrypted read-back validation
        if: github.event_name == 'workflow_dispatch'
        run: bash docs/security/tools/run-sec030-whole.sh large

